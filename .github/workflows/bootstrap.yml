name: Publish update

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply update
        run: |
          mkdir update
          tar -xzf updates.tar.gz -C update
          rm updates.tar.gz
          cp -a update/. .
          rm -rf update
          rm .github/workflows/bootstrap.yml
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          git add -A
          git commit -m "Update claim protections and menus"
          git push
