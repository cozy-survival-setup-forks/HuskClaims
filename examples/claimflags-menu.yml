# DeluxeMenus claim settings menu. Needs PlaceholderAPI. Put it in DeluxeMenus/gui_menus and register it in config.yml.
# Each toggle uses one operation group: its command and its %huskclaims_group_<id>% placeholder.
open_command:
  - claimsettings
  - claimflags
register_command: true
size: 45
menu_title: '&0| Claims - Settings'
update_interval: 1

items:
  'filler':
    material: BLACK_STAINED_GLASS_PANE
    display_name: '&7'
    slots: [0-44]

  'information':
    material: BOOK
    slot: 4
    update: true
    item_flags: &item_flags
      - HIDE_ATTRIBUTES
      - HIDE_ENCHANTS
      - HIDE_ADDITIONAL_TOOLTIP
      - HIDE_DYE
      - HIDE_UNBREAKABLE
    display_name: '&#74C7FF&lCLAIM SETTINGS'
    lore:
      - '&#B6C1C8Claims'
      - ''
      - '&#FF9558Description:'
      - '&fManage the &#74C7FFclaim &fyou are'
      - '&fcurrently standing inside.'
      - ''
      - '&#FF9558How does it work?'
      - '&fClick a setting to &#FFE05Aenable'
      - '&for &#FF7490disable &fit for this claim.'
      - ''
      - '&#B6C1C8You must be allowed to manage'
      - '&#B6C1C8operation groups in this claim.'

  'no_claim':
    material: BARRIER
    slot: 22
    priority: 20
    update: true
    item_flags: *item_flags
    display_name: '&#FF4361&lNO CLAIM FOUND'
    lore:
      - '&#B6C1C8Claims'
      - ''
      - '&#FF9558Description:'
      - '&fStand inside the &#74C7FFclaim &fyou'
      - '&fwant to configure, then reopen this menu.'
      - ''
      - '&#FF4361✘ &#FF4361You are not inside a claim.'
    view_requirement:
      requirements:
        outside_claim:
          type: string equals
          input: '%huskclaims_in_claim%'
          output: 'false'

  'explosions_enabled':
    material: TNT
    slot: 10
    priority: 2
    update: true
    item_flags: *item_flags
    display_name: '&#95FF7E&lCLAIM EXPLOSIONS'
    lore: &explosions_enabled_lore
      - '&#B6C1C8Claims'
      - ''
      - '&#FF9558Description:'
      - '&fAllow &#FFE05Aexplosions &fto damage'
      - '&fterrain inside this claim.'
      - ''
      - '&#95FF7E✔ Enabled'
      - '&7✘ Disabled'
      - ''
      - '&#FF9558⏵ &#FF9558&l&nCLICK&r &#FF9558to Disable'
    view_requirement: &explosions_enabled_requirement
      requirements:
        in_claim:
          type: string equals
          input: '%huskclaims_in_claim%'
          output: 'true'
        enabled:
          type: string equals
          input: '%huskclaims_group_explosions%'
          output: 'true'
    click_commands:
      - '[player] claimexplosions off'
      - '[sound] UI_BUTTON_CLICK'
      - '[sound] BLOCK_NOTE_BLOCK_BASS 0.3'
      - '[refresh]'

